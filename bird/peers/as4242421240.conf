# Peer: PrefixLabs DE-01 Nürnberg (AS4242421240) - IPv6 Link-Local with MP-BGP and Extended Next Hop
protocol bgp prefixlabs_de01_v6 from dnpeers {
    enable extended messages on;
    local fe80::257 as 4242420257;
    neighbor fe80::1240:11 as 4242421240;
    interface "wg-as4242421240";
    description "PrefixLabs DE-01 Nürnberg - AS4242421240 - IPv6 LL with MP-BGP";
    direct;

    # Enable MP-BGP: Exchange IPv4 routes over IPv6 session with Extended Next Hop
    ipv4 {
        extended next hop yes;
        import keep filtered;
        import filter {
            if is_valid_network_v4() && !is_self_net_v4() then {
                accept;
            }
            reject;
        };
        export filter {
            if is_valid_network_v4() then {
                accept;
            }
            reject;
        };
    };

    ipv6 {
        import keep filtered;
        import filter {
            if is_valid_network_v6() && !is_self_net_v6() then {
                accept;
            }
            reject;
        };
        export filter {
            if is_valid_network_v6() then {
                accept;
            }
            reject;
        };
    };
}
